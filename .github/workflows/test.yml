name: Tests

on:
  push:
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Verify manifests and generated code
        run: |
          make manifests generate
          if ! git diff --exit-code -- config/ api/; then
            echo "::error::Generated manifests or deepcopy are out of date. Run 'make manifests generate' and commit the changes."
            exit 1
          fi
          if ! diff -u config/crd/bases/drift.somaz.io_driftchecks.yaml helm/kube-drift/crds/drift.somaz.io_driftchecks.yaml; then
            echo "::error::helm/kube-drift/crds is out of sync with config/crd/bases. Copy the regenerated CRD into the chart."
            exit 1
          fi
