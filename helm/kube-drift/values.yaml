# Default values for kube-drift.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# Target namespace override for the controller and its namespaced resources.
# Empty = use the release namespace (the `-n` flag). Set this only to pin a fixed
# namespace regardless of the release namespace.
namespace: ""
# Create `namespace` above (no-op while it is empty). Leave false with
# `helm install --create-namespace` to avoid a namespace ownership conflict.
namespaceCreate: false

image:
  repository: somaz940/kube-drift
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

serviceAccount:
  create: true
  # Empty = derived as <fullname>-controller-manager (release-scoped).
  name: ""
  annotations: {}

# create=false also suppresses viewRole and extraRules below.
rbac:
  create: true
  # Bind the controller ServiceAccount to the built-in `view` ClusterRole so it
  # can read arbitrary kinds for comparison (`view` excludes Secrets and RBAC).
  # Off by default: the controller's own role reads only ConfigMaps and Secrets.
  viewRole:
    enabled: false
  # Extra read rules granted to the controller ServiceAccount for comparing
  # additional kinds not covered by the controller's own role or `view`. When
  # non-empty, a dedicated ClusterRole (+ binding) is created. Use read verbs
  # only (get/list/watch) — the controller never writes to compared resources.
  # Each entry is a standard RBAC policy rule, e.g.:
  #   extraRules:
  #     - apiGroups: ["apps"]
  #       resources: ["deployments", "statefulsets"]
  #       verbs: ["get", "list", "watch"]
  extraRules: []

# Leader election for HA controller deployments.
leaderElection:
  enabled: true

metrics:
  enabled: true
  # Serve metrics over HTTPS with authn/authz (recommended). Set false for HTTP.
  secure: true
  port: 8443
  service:
    type: ClusterIP

# Health / readiness probe endpoint.
health:
  port: 8081

# Extra args appended to the manager container command.
extraArgs: []

terminationGracePeriodSeconds: 10

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
